version: "3.7"
services:
  ocis:
    image: owncloud/ocis:3.1.0-next.2
    extra_hosts:
      - host.docker.internal:host-gateway
    entrypoint:
      - /bin/sh
      - /entrypoint-override.sh
    volumes:
      - ./entrypoint-override.sh:/entrypoint-override.sh
      # Modify to map to your desired location
      - /media/NAS/s3/ocis/config:/etc/ocis
      - /media/NAS/s3/ocis/data:/var/lib/ocis
    environment:
      ##############################
      # For local development, make sure -not- to enable this when your server is accessible through the internet
      # OCIS_INSECURE: true
      # OCDAV_INSECURE: true
      # PROXY_OIDC_INSECURE: true
      # PROXY_INSECURE_BACKENDS: true
      ##############################
      ### Add an entry to /etc/hosts which points your domain to your server locally
      # OCIS_LOG_LEVEL: debug
      PROXY_ENABLE_BASIC_AUTH: true
      OCIS_URL: https://${OCIS_DOMAIN}
      OCIS_INSECURE: false
      PROXY_TLS: false
      IDM_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    labels:
      caddy: ${OCIS_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 9200}}"
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true
