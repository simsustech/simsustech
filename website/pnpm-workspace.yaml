# pnpm 12 does not run a dependency's build scripts unless they are allowlisted,
# and it fails the install when one is skipped. These need theirs:
#   - esbuild / sharp select and link a prebuilt native binary at install time,
#   - @parcel/watcher compiles its native watcher.
# Vitrify's dev server uses esbuild, so without these the project installs but
# cannot build.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - unocss-preset-quasar@0.7.0
  - '@fastify/middie@9.3.6'
  - vite@8.3.5
  - '@simple-site-generator/templates@0.3.0 || 0.4.0 || 0.4.1 || 0.5.1 || 0.6.0 || 0.6.1'
  - simple-site-generator@0.3.0 || 0.4.0 || 0.4.1 || 0.5.1 || 0.6.0 || 0.6.1
  - vitrify@0.30.0 || 0.31.0 || 0.32.0
  - '@vitest/mocker@5.1.0'
  - '@vitest/spy@5.1.0'
  - fastify@5.12.8
  - vitest@5.1.0
