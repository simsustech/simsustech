<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">The stack a simsustech web application is built on</title>
  <desc id="desc">Interface in Vue, Quasar and Vitrify; a typed contract with tRPC and zod; an API in Fastify; data in PostgreSQL through Kysely; and integrations for sign-in, payments and e-invoicing.</desc>

  <style>
    .panel { fill: #ffffff; }
    .edge { fill: none; stroke: #c2c8bc; }
    .title { fill: #1a1c19; font: 700 40px/1 system-ui, sans-serif; }
    .note { fill: #42493f; font: 400 24px/1 system-ui, sans-serif; }
    .row { fill: #f4f4ee; stroke: #c2c8bc; stroke-width: 2; }
    .row-key { fill: #d6e8cd; stroke: #006e0c; stroke-width: 2; }
    .stage { fill: #006e0c; font: 700 20px/1 system-ui, sans-serif; }
    .tech { fill: #1a1c19; font: 600 25px/1 system-ui, sans-serif; }
    .detail { fill: #42493f; font: 400 20px/1 system-ui, sans-serif; }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="1199" height="499" rx="24" />
  <rect class="edge" x="0.5" y="0.5" width="1199" height="499" rx="24" />

  <text class="title" x="64" y="88">One stack, end to end</text>
  <text class="note" x="64" y="126">TypeScript from the database row to the button that renders it.</text>

  <g>
    <rect class="row-key" x="64" y="156" width="150" height="60" rx="12" />
    <text class="stage" x="84" y="193">INTERFACE</text>
    <rect class="row" x="230" y="156" width="906" height="60" rx="12" />
    <text class="tech" x="258" y="194">Vue 3 · Quasar Framework · Vitrify</text>
  </g>

  <g>
    <rect class="row-key" x="64" y="228" width="150" height="60" rx="12" />
    <text class="stage" x="84" y="265">CONTRACT</text>
    <rect class="row" x="230" y="228" width="906" height="60" rx="12" />
    <text class="tech" x="258" y="266">tRPC · zod</text>
    <text class="detail" x="560" y="266">a changed field is a compile error, not a bug report</text>
  </g>

  <g>
    <rect class="row-key" x="64" y="300" width="150" height="60" rx="12" />
    <text class="stage" x="84" y="337">API</text>
    <rect class="row" x="230" y="300" width="906" height="60" rx="12" />
    <text class="tech" x="258" y="338">Fastify · Modular API</text>
  </g>

  <g>
    <rect class="row-key" x="64" y="372" width="150" height="60" rx="12" />
    <text class="stage" x="84" y="409">DATA</text>
    <rect class="row" x="230" y="372" width="906" height="60" rx="12" />
    <text class="tech" x="258" y="410">PostgreSQL · Kysely</text>
    <text class="detail" x="560" y="410">real SQL, typed — no query builder hiding the plan</text>
  </g>

  <text class="note" x="64" y="472">Integrations when they are needed: OpenID Connect, payments, EU invoicing.</text>
</svg>
