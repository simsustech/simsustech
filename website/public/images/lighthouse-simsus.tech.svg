<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc" class="figure">
  <title id="title">Lighthouse scores for simsus.tech</title>
  <desc id="desc">Lighthouse's report for simsus.tech, in both the mobile and the desktop form factor: performance 100, accessibility 100, best practices 100 and SEO 100, measured in the verification run that gates every deploy.</desc>

  <!--
    No styles here on purpose. This file is inlined into the page by the markdown
    rule in `vitrify.config.ts`, and the palette lives in `src/styles/figures.css`
    beside the rest of the site's colours — one definition shared by every figure,
    switched by the dark class that the header's theme toggle puts on the body.
    Keep colours out of fill and stroke attributes: an attribute beats the
    stylesheet, and the dark palette would never apply.
  -->

  <rect class="fig-panel" x="0.5" y="0.5" width="1199" height="448" rx="24" />
  <rect class="fig-edge" x="0.5" y="0.5" width="1199" height="448" rx="24" />

  <text class="fig-title" x="64" y="92">Lighthouse</text>
  <text class="fig-note" x="64" y="130">simsus.tech</text>

  <!-- Both runs, because they are two measurements and both are 100: the form
       factor is part of a Lighthouse result, so it is stated rather than implied. -->
  <rect class="fig-chip" x="920" y="58" width="102" height="40" rx="20" />
  <text class="fig-chip-label" x="971" y="84">Mobile</text>
  <rect class="fig-chip" x="1034" y="58" width="102" height="40" rx="20" />
  <text class="fig-chip-label" x="1085" y="84">Desktop</text>

  <!-- The four categories in the order Lighthouse reports them: performance
       first, then the three that are gated at 100. r=56, so a full circle is
       2πr = 351.86 of stroke, drawn from the top with rotate(-90). -->

  <g transform="translate(225 240)">
    <circle class="fig-ring fig-track" r="56" />
    <circle class="fig-ring fig-pass" r="56" stroke-dasharray="351.86 351.86" transform="rotate(-90)" />
    <text class="fig-score" y="15">100</text>
  </g>
  <text class="fig-label" x="225" y="340">Performance</text>

  <g transform="translate(475 240)">
    <circle class="fig-ring fig-track" r="56" />
    <circle class="fig-ring fig-pass" r="56" stroke-dasharray="351.86 351.86" transform="rotate(-90)" />
    <text class="fig-score" y="15">100</text>
  </g>
  <text class="fig-label" x="475" y="340">Accessibility</text>

  <g transform="translate(725 240)">
    <circle class="fig-ring fig-track" r="56" />
    <circle class="fig-ring fig-pass" r="56" stroke-dasharray="351.86 351.86" transform="rotate(-90)" />
    <text class="fig-score" y="15">100</text>
  </g>
  <text class="fig-label" x="725" y="340">Best Practices</text>

  <g transform="translate(975 240)">
    <circle class="fig-ring fig-track" r="56" />
    <circle class="fig-ring fig-pass" r="56" stroke-dasharray="351.86 351.86" transform="rotate(-90)" />
    <text class="fig-score" y="15">100</text>
  </g>
  <text class="fig-label" x="975" y="340">SEO</text>

  <text class="fig-note" x="64" y="394">The mobile and the desktop run both measure 100, on all 39 pages.</text>
  <text class="fig-note" x="64" y="426">JavaScript 201 KB of 250 KB. CSS 36 KB of 60 KB. Performance warns, it does not gate.</text>
</svg>
