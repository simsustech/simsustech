<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 560"
  width="1200"
  height="560"
  role="img"
  aria-label="Abstract diagram of connected services"
>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#004d08" />
      <stop offset="1" stop-color="#007a0e" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c92a" stop-opacity="0.35" />
      <stop offset="1" stop-color="#22c92a" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#panel)" />
  <circle cx="960" cy="90" r="240" fill="url(#glow)" />

  <!-- Grid, suggesting structure without noise -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 140h1200M0 280h1200M0 420h1200" />
    <path d="M200 0v560M400 0v560M600 0v560M800 0v560M1000 0v560" />
  </g>

  <!-- Connected services: front end, API, data, integrations -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="12 12" fill="none">
    <path d="M250 380 L470 210 L700 330 L965 150" />
    <path d="M470 210 L700 330" />
  </g>

  <g fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4">
    <circle cx="250" cy="380" r="42" />
    <circle cx="470" cy="210" r="52" />
    <circle cx="700" cy="330" r="42" />
    <circle cx="965" cy="150" r="46" />
  </g>

  <g stroke="#ffffff" stroke-width="6">
    <circle cx="250" cy="380" r="16" fill="#22c92a" />
    <circle cx="470" cy="210" r="20" fill="#eece0c" />
    <circle cx="700" cy="330" r="16" fill="#00a4e6" />
    <circle cx="965" cy="150" r="18" fill="#ffffff" />
  </g>

  <!-- Caption bar: a page being composed -->
  <g transform="translate(120 92)" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3">
    <rect width="300" height="86" rx="14" />
    <path d="M22 30h256M22 48h196M22 66h120" stroke-linecap="round" />
  </g>
</svg>
