<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc" class="figure">
  <title id="title">How this website is built and served</title>
  <desc id="desc">Markdown content is prerendered by Vitrify with Vue and Quasar, verified for accessibility, SEO, budgets and Lighthouse, then served as static files by Caddy. No database and no runtime are involved.</desc>

  <!--
    No styles here on purpose: inlined by the markdown rule in
    `vitrify.config.ts`, themed by `src/styles/figures.css` with the same
    dark class the rest of the page uses. Keep colours out of fill and
    stroke attributes, which would beat the stylesheet.
  -->

  <rect class="fig-panel" x="0.5" y="0.5" width="1199" height="429" rx="24" />
  <rect class="fig-edge" x="0.5" y="0.5" width="1199" height="429" rx="24" />

  <text class="fig-title" x="64" y="92">How this site is built and served</text>
  <text class="fig-note" x="64" y="132">From a Markdown file to a visitor, with a gate that can refuse the result.</text>

  <g>
    <rect class="fig-step-alt" x="64" y="176" width="200" height="130" rx="16" />
    <text class="fig-step-title" x="164" y="228">Markdown</text>
    <text class="fig-step-note" x="164" y="258">content +</text>
    <text class="fig-step-note" x="164" y="284">frontmatter</text>
  </g>

  <g>
    <rect class="fig-step" x="304" y="176" width="200" height="130" rx="16" />
    <text class="fig-step-title" x="404" y="228">Prerender</text>
    <text class="fig-step-note" x="404" y="258">Vue + Quasar,</text>
    <text class="fig-step-note" x="404" y="284">via Vitrify</text>
  </g>

  <g>
    <rect class="fig-step" x="544" y="176" width="200" height="130" rx="16" />
    <text class="fig-step-title" x="644" y="228">Verify</text>
    <text class="fig-step-note" x="644" y="250">accessibility,</text>
    <text class="fig-step-note" x="644" y="274">SEO, budgets,</text>
    <text class="fig-step-note" x="644" y="298">Lighthouse</text>
  </g>

  <g>
    <rect class="fig-step-alt" x="784" y="176" width="200" height="130" rx="16" />
    <text class="fig-step-title" x="884" y="228">Serves</text>
    <text class="fig-step-note" x="884" y="258">Caddy: gzip,</text>
    <text class="fig-step-note" x="884" y="284">immutable caching</text>
  </g>

  <g>
    <rect class="fig-step" x="1024" y="176" width="112" height="130" rx="16" />
    <text class="fig-step-title" x="1080" y="248">Visitor</text>
  </g>

  <path class="fig-flow" d="M264 241 H296" marker-end="url(#a)" />
  <path class="fig-flow" d="M504 241 H536" marker-end="url(#a)" />
  <path class="fig-flow" d="M744 241 H776" marker-end="url(#a)" />
  <path class="fig-flow" d="M984 241 H1016" marker-end="url(#a)" />

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="fig-arrowhead" d="M0 0 L10 5 L0 10 z" />
    </marker>
  </defs>

  <text class="fig-accent-text" x="80" y="360">No database</text>
  <text class="fig-accent-text" x="300" y="360">No server process</text>
  <text class="fig-accent-text" x="520" y="360">Nothing to patch</text>
  <text class="fig-note" x="64" y="398">Every page is a file: that is why hosting is cheap, and why the build decides.</text>
</svg>
